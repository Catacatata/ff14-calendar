name: Test Bilibili Source (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ff14-bilibili-source-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated test dependencies
        run: python -m pip install bilibili-api-python==17.4.2 aiohttp==3.13.3

      - name: Test anonymous dynamic feed and Opus content
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/test_bilibili_source.py

      - name: Verify tracked repository files are unchanged
        if: always()
        run: git diff --exit-code HEAD
