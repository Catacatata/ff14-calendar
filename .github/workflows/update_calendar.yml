name: Update FF14 Calendar

on:
  schedule:
    # UTC 02:17 = 北京时间 10:17，作为备用更新
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ff14-calendar-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Show trigger and actual start time
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          echo "触发类型：$EVENT_NAME"
          echo "定时表达式：$CRON_EXPRESSION"
          TZ=Asia/Shanghai date '+实际执行时间：%Y-%m-%d %H:%M:%S 北京时间'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install requests feedparser beautifulsoup4 pillow

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Enrich activity details and images
        run: python enrich_calendar.py

      - name: Update Chinese holidays
        run: python update_holidays.py

      - name: Check generated files
        run: |
          test -s ff14.ics
          test -s calendar.json
          test -s holidays.json
          python -m json.tool calendar.json > /dev/null
          python -m json.tool holidays.json > /dev/null
          git status --short

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f ff14.ics calendar.json holidays.json

          for file in \
            data/api_cache.json \
            data/rss_cache.json \
            data/event_details_cache.json
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          for directory in \
            data/holiday-cn \
            images/events
          do
            if [ -d "$directory" ]; then
              git add -f "$directory"
            fi
          done

          if git diff --cached --quiet; then
            echo "数据没有变化，无需提交。"
          else
            git commit -m "Auto update FF14 calendar, activity details and holidays"
            git push origin HEAD:main
          fi